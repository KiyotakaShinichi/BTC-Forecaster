[mypy]
python_version = 3.11
plugins = pydantic.mypy
strict = True
warn_unreachable = True
show_error_codes = True

[mypy-duckdb.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

# B4 research adapters. yfinance and matplotlib ship no stubs; they are confined
# to the provider seam and the plotting module, and no unit test imports them.
[mypy-yfinance.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

# numpy is imported inside one B4 cross-asset helper. It is a *research*
# dependency and lives in the root requirements, not in
# requirements-market-intelligence.txt -- so it is present on a developer machine
# that has run the quant tracks and absent in the collection CI job. mypy strict
# then passed locally and failed remotely on every push, which is why this was
# invisible until CI was actually read.
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True
