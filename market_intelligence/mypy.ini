[mypy]
python_version = 3.11
plugins = pydantic.mypy
strict = True
warn_unreachable = True
show_error_codes = True

[mypy-duckdb.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

# B4 research adapters. yfinance and matplotlib ship no stubs; they are confined
# to the provider seam and the plotting module, and no unit test imports them.
[mypy-yfinance.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-statsmodels.*]
ignore_missing_imports = True
