# The quantitative core's test suite and its coverage floor. It runs A2's
# evaluation semantics, the A4 typed core, the C0 paper engine and the A3 shadow
# ledger -- every test that is not the collector's. The filename is left as
# c0-validation.yml so this workflow keeps its run history; GitHub keys that on
# the path, not the name.
#
# Tests only. Ruff, mypy, compileall and the dependency contract live in
# `quality.yml`, which runs on every push with no path filter -- so a change
# that touches only the collector still gets the whole repository linted, and
# each check has exactly one home.
name: Quantitative core (A2/A4 + C0 paper + A3 shadow)

# Scoped to the quantitative core. The collector has its own workflow, its own
# lint contract and its own coverage floor; before these filters existed this
# job ran on every push, including collector-only ones, and linted the
# collector's tests under the wrong ruff config.
on:
  push:
    paths:
      - "btc_forecaster/**"
      - "tests/**"
      - "api_server.py"
      - "scripts/coverage.sh"
      - "pyproject.toml"
      - "constraints.txt"
      - ".github/workflows/c0-validation.yml"
  pull_request:
    paths:
      - "btc_forecaster/**"
      - "tests/**"
      - "api_server.py"
      - "pyproject.toml"
      - "constraints.txt"

jobs:
  quant-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install declared environment
        run: python -m pip install -e ".[dev]" -c constraints.txt
      # Output captured so a failure is legible to anyone who can see the repo:
      # job logs need `actions:read` and step summaries are not exposed by the
      # API at all, but annotations are.
      - name: Full pytest and coverage
        run: |
          set -o pipefail
          bash scripts/coverage.sh 2>&1 | tee pytest.log
      - name: Publish failure detail
        if: failure()
        run: |
          echo "### quantitative core failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 pytest.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          detail=$(grep -E "^(FAILED|ERROR|E  )|Required test coverage" pytest.log | head -n 30 | sed "s/%/%25/g" | awk '{printf "%s%%0A", $0}')
          echo "::error title=quantitative core::${detail:-see step summary}"
      - name: C0 fail-closed A2 regression
        run: python -m pytest tests/test_paper_a2_regression.py -q

      # A6 model zoo. The full forty-model benchmark is an explicit research
      # command, not a CI job: it fits seven neural networks and takes minutes.
      # What runs here is what protects the zoo -- the registry agreeing with
      # itself, the leakage adversaries, the synthetic worlds including the
      # NOISE_ONLY control, and a smoke benchmark small enough to be free.
      #
      # This job installs `.[dev]`, so scikit-learn, arch and xgboost are
      # absent. That is deliberate rather than tolerated: it is the environment
      # in which the zoo has to degrade to SKIPPED_DEPENDENCY rather than
      # failing, and the tests filter their model lists so the adversaries keep
      # running on the families that need nothing beyond the core install.
      - name: A6 registry is self-consistent
        run: python -m btc_forecaster.research.model_zoo --list

      - name: A6 smoke benchmark (4 models, no optional dependencies)
        run: |
          python - <<'PY'
          from btc_forecaster.research.partition import PartitionSpec
          from btc_forecaster.research.runner import assert_nothing_promoted, build_manifest, run_benchmark
          from btc_forecaster.testing import synthetic_market_frame

          frame = synthetic_market_frame(periods=500, kind="ar1", seed=99)
          result = run_benchmark(
              frame,
              spec=PartitionSpec(train_rows=150),
              model_ids=["naive_last_value", "random_walk_drift", "ar_p", "mlp"],
          )
          manifest = build_manifest(result)
          assert_nothing_promoted(manifest)
          scored = len(result.succeeded())
          assert scored == 4, f"expected 4 scored models, got {scored}"
          assert manifest["promoted_models"] == []
          assert manifest["live_trading_enabled"] is False
          print(f"A6 smoke OK: {scored} models, nothing promoted, trading disabled")
          PY

      # A7 walk-forward robustness. The full benchmark -- 220 jobs, twelve
      # refits each, four horizons, five windows -- is an explicit research
      # command, not a CI job. What runs here protects it: the snapshot
      # fingerprint and its refusal of a changed input, and a smoke benchmark
      # run twice on a synthetic world -- once with two workers, once with one
      # -- whose canonical result digests must agree byte for byte. The A7 test
      # files (synthetic worlds, leakage adversaries, hashing, the registry)
      # already ran in the pytest step above.
      - name: A7 snapshot fingerprint refuses a changed input
        run: |
          python - <<'PY'
          import pandas as pd
          from btc_forecaster.data.snapshot import MarketSnapshot
          from btc_forecaster.testing import synthetic_market_frame

          snapshot = MarketSnapshot.build(
              synthetic_market_frame(periods=400, seed=5),
              ticker="CI-SYNTHETIC",
              provider="synthetic",
              retrieved_at=pd.Timestamp("2000-01-01", tz="UTC"),
          )
          snapshot.save(".ci-a7-snapshot")
          with open(".ci-a7-expected.sha", "w") as handle:
              handle.write(snapshot.manifest.sha256)
          PY
          python -m btc_forecaster.research.snapshot fingerprint .ci-a7-snapshot
          python -m btc_forecaster.research.snapshot verify .ci-a7-snapshot --expect "$(cat .ci-a7-expected.sha)"
          set +e
          python -m btc_forecaster.research.snapshot verify .ci-a7-snapshot --expect "$(printf '0%.0s' $(seq 64))"
          code=$?
          set -e
          test "$code" -eq 3 || { echo "::error title=A7::a changed input was not refused (exit $code)"; exit 1; }

      - name: A7 smoke benchmark is byte-reproducible across worker counts
        run: |
          python -m btc_forecaster.research.walk_forward run --world NOISE --smoke --workers 2 --output .ci-a7-first
          python -m btc_forecaster.research.walk_forward run --world NOISE --smoke --workers 1 --output .ci-a7-second
          python -m btc_forecaster.research.walk_forward verify .ci-a7-first
          python -m btc_forecaster.research.walk_forward verify .ci-a7-second
          python - <<'PY'
          import json
          import pathlib

          first = json.loads(pathlib.Path(".ci-a7-first/manifest.json").read_text())
          second = json.loads(pathlib.Path(".ci-a7-second/manifest.json").read_text())
          assert first["result_digest"] == second["result_digest"], "two runs of one config disagree"
          assert first["promoted_models"] == [] and first["live_trading_enabled"] is False
          assert first["decision"] != "ROBUST_RESEARCH_CANDIDATE", "pure noise produced a candidate"
          print("A7 smoke OK:", first["decision"], first["result_digest"][:16])
          PY
