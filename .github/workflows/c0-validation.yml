name: C0 validation

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install declared environment
        run: python -m pip install -e ".[dev]" -c constraints.txt
      - name: Ruff
        run: python -m ruff check btc_forecaster tests
      - name: Mypy
        run: python -m mypy btc_forecaster --ignore-missing-imports
      - name: Compile
        run: python -m compileall -q btc_forecaster tests api_server.py
      - name: Full pytest and coverage
        run: bash scripts/coverage.sh
      - name: C0 fail-closed A2 regression
        run: python -m pytest tests/test_paper_a2_regression.py -q
      - name: Diff integrity
        run: git diff --check
