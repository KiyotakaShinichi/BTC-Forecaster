name: Market Intelligence

on:
  push:
    paths:
      - "market_intelligence/**"
      - "tests/test_intelligence_*.py"
      - "btc-intel*.py"
      - "scripts/profile_replay.py"
      - "scripts/bench_replay.py"
      - "scripts/bench_matrix.py"
      - "scripts/b4_data_audit.py"
      - "scripts/b4_run_study.py"
      - "requirements-market-intelligence*.txt"
      - ".github/workflows/market-intelligence.yml"
  pull_request:
    paths:
      - "market_intelligence/**"
      - "tests/test_intelligence_*.py"
      - "btc-intel*.py"
      - "requirements-market-intelligence*.txt"

jobs:
  intelligence:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/btc-intel-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-market-intelligence-dev.txt
      - run: python -m ruff check --config market_intelligence/ruff.toml market_intelligence scripts btc-intel.py btc-intel-api.py tests/test_intelligence_*.py
      - run: python -m mypy --config-file market_intelligence/mypy.ini market_intelligence scripts btc-intel.py btc-intel-api.py
      # Output is captured so a failure is legible to somebody without admin
      # rights on this repository: job logs need `actions:read`, but a step
      # summary is published in the check run and is readable by anyone who can
      # see the repo. Six consecutive red runs went undiagnosed for exactly
      # this reason.
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -q -rf --tb=short --cov=market_intelligence --cov-branch --cov-fail-under=75 tests 2>&1 | tee pytest.log
      - name: Publish test failure summary
        if: failure()
        run: |
          echo "### pytest failed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 pytest.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - run: python -m compileall -q market_intelligence scripts tests btc-intel.py btc-intel-api.py
      - run: python btc-intel.py demo --output-dir .ci-intelligence-demo
      - run: python btc-intel.py gold-report --output .ci-gold-report.json
      - run: python -c "import hashlib,json,pathlib; p=pathlib.Path('.ci-intelligence-demo/replay-features.parquet'); m=json.loads(pathlib.Path('.ci-intelligence-demo/replay-features.manifest.json').read_text()); assert m['file_hash']==hashlib.sha256(p.read_bytes()).hexdigest(); assert m['row_count']==2"
      # B3.1.24: verify the optimised historical path the demo also exercises.
      # Lightweight and deterministic -- no wall-clock assertions, no large
      # replay. The 10,000-origin benchmark stays out of CI by design.
      - name: Verify historical feature matrix, manifest and catalog
        run: python -c "import hashlib,json,pathlib; p=pathlib.Path('.ci-intelligence-demo/historical-features.parquet'); m=json.loads(pathlib.Path('.ci-intelligence-demo/historical-features.manifest.json').read_text()); assert m['file_hash']==hashlib.sha256(p.read_bytes()).hexdigest(); assert m['row_count']==12; assert m['mode']=='OPTIMIZED'; assert len(m['columns'])==11"
      - name: Verify catalog entry and dataset API
        run: python -c "from fastapi.testclient import TestClient; from market_intelligence.api import create_app; c=TestClient(create_app('.ci-intelligence-demo/demo-intelligence.duckdb')); d=c.get('/datasets').json(); assert len(d)>=1; assert c.get('/datasets/'+d[0]['dataset_id']).status_code==200; assert c.get('/datasets/'+'0'*64).status_code==404"
      - run: python -c "from fastapi.testclient import TestClient; from market_intelligence.api import create_app; c=TestClient(create_app('.ci-intelligence-demo/demo-intelligence.duckdb')); assert c.get('/health').status_code==200; assert c.get('/ready').json()['status']=='ready'"
      # B4.54: research smoke tests only. The full historical study needs the
      # network and takes minutes; CI proves the machinery is wired correctly on
      # fixtures instead. No network, no wall-clock assertions.
      - name: B4 target semantics and leakage audit
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from market_intelligence.b4.contracts import (
              EvidenceTier, MarketBar, MarketSeries, SourceDomain, TimestampConvention,
          )
          from market_intelligence.b4.targets import (
              assert_targets_are_future_only, build_targets,
          )
          base = datetime(2026, 1, 1, tzinfo=timezone.utc)
          series = MarketSeries(
              series_id="s", ticker="T", domain=SourceDomain.BTC_MARKET, provider="fixture",
              timestamp_convention=TimestampConvention.PERIOD_OPEN,
              evidence_tier=EvidenceTier.PIT_VALIDATED, source_timezone="UTC",
              bars=tuple(
                  MarketBar(period_start=base + timedelta(hours=i), period_seconds=3600,
                            open=100.0 + i, high=100.0 + i, low=100.0 + i, close=100.0 + i, volume=1.0)
                  for i in range(48)
              ),
          )
          origins = [base + timedelta(hours=i) for i in range(1, 24)]
          rows = build_targets(series, origins, ["1h", "6h"])
          assert rows, "targets must be produced"
          assert all(r.base_available_at <= r.forecast_origin for r in rows)
          assert_targets_are_future_only(series, rows, ["1h", "6h"])
          print(f"B4 targets OK: {len(rows)} rows, leakage audit passed")
          PY
      - name: B4 preregistration, registry and evidence-tier separation
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from market_intelligence.b4.contracts import EvidenceTier
          from market_intelligence.b4.prereg import CarryForwardPolicy, Preregistration, split_history
          from market_intelligence.b4.registry import SignalDecision, decide
          from market_intelligence.b4.stats import BootstrapConfig, PracticalThreshold
          base = datetime(2022, 1, 1, tzinfo=timezone.utc)
          plan = Preregistration(
              created_at=base, git_sha="ci", research_questions=("q",), event_types=("REGULATION",),
              entities=("SEC",), horizons=("1h",), extraction_quality_filters={"minimum_relevance": 0.5},
              minimum_event_count=30, bootstrap=BootstrapConfig(replicates=100),
              practical_thresholds=(PracticalThreshold(outcome="forward_return_1h",
                                                       minimum_absolute_effect=0.004, justification="ci"),),
              multiple_testing_families=("f",), carry_forward_policy=CarryForwardPolicy(),
              period_split=split_history(base, base + timedelta(days=1000)),
          )
          assert plan.content_hash() == Preregistration.model_validate(
              plan.model_dump(mode="json")).content_hash()
          decision, reasons = decide(
              signal_id="s", policy=plan.carry_forward_policy, sample_count=0,
              effective_sample_count=0, pit_status=None, best=None, evidence=None,
              stable=None, fragile=None, largest_source_share=None,
          )
          assert decision is SignalDecision.INSUFFICIENT_DATA, decision
          decision, _ = decide(
              signal_id="s", policy=plan.carry_forward_policy, sample_count=200,
              effective_sample_count=60, pit_status=EvidenceTier.RETROSPECTIVE_ONLY,
              best=None, evidence=None, stable=True, fragile=False, largest_source_share=0.1,
          )
          assert decision is SignalDecision.INSUFFICIENT_DATA, decision
          print("B4 preregistration and registry OK")
          PY
      # B4.1.50: forward-collection smoke, entirely offline. Fixture providers
      # only; no real feed is contacted and no credential is required.
      - name: B4.1 offline collection, corpus and PIT adversaries
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import tempfile, pathlib
          from market_intelligence.collection.fixtures import (
              FIXTURE_BASE, OutageProvider, StaticFixtureProvider, primary_and_secondary, late_source,
          )
          from market_intelligence.collection.service import ForwardCollector
          from market_intelligence.configuration import (
              EntityType, ProviderCategory, ProviderConfig, QueryPlanner, WatchEntity,
          )
          from market_intelligence.extractors import RuleBasedExtractor
          from market_intelligence.models import EventType
          from market_intelligence.retrieval import MultiProviderRetriever
          from market_intelligence.storage import IntelligenceStore

          now = FIXTURE_BASE
          watch = [WatchEntity(canonical_name="SEC", aliases=("Securities and Exchange Commission",),
                               entity_type=EntityType.REGULATOR, topics=("bitcoin regulation",),
                               expected_event_types=(EventType.REGULATION,))]
          queries = QueryPlanner().plan(watch, now)
          official, coverage = primary_and_secondary(now - timedelta(hours=1))
          docs = [official.model_copy(update={"query": queries[0].query}),
                  coverage.model_copy(update={"query": queries[0].query})]
          providers = {"fixture": StaticFixtureProvider(docs, now=lambda: now, restamp=False),
                       "outage": OutageProvider()}
          configs = {p: ProviderConfig(id=p, type="fixture",
                                       source_category=ProviderCategory.GENERAL_WEB, timeout=5.0)
                     for p in providers}

          with tempfile.TemporaryDirectory() as tmp:
              store = IntelligenceStore(pathlib.Path(tmp) / "c.duckdb")
              extractor = RuleBasedExtractor({"SEC": ("Securities and Exchange Commission",)})
              collector = ForwardCollector(store, now=lambda: now)
              first = collector.collect(queries, MultiProviderRetriever(providers, configs),
                                        extractor, {"w": "ci"})
              assert first.manifest.documents_new > 0, "fixture collection produced nothing"
              assert first.manifest.provider_success["outage"] is False, "outage must be recorded"
              assert first.snapshot is not None, "a corpus snapshot must be registered"

              # Rediscovery must not rewrite availability (B4.1.12).
              before = {d.document_id: d.available_at for d in store.documents_as_of(now)}
              collector._now = lambda: now + timedelta(days=3)
              second = collector.collect(queries, MultiProviderRetriever(providers, configs),
                                         extractor, {"w": "ci"})
              after = {d.document_id: d.available_at
                       for d in store.documents_as_of(now + timedelta(days=3))}
              assert second.manifest.documents_new == 0, "rediscovery must not add documents"
              assert after == before, "rediscovery must not move availability"

              # An old article retrieved today is available today (B4.1.39).
              stale = late_source(now)
              assert stale.published_at < now - timedelta(days=20) and stale.available_at == now
              store.close()
          print("B4.1 offline collection OK")
          PY
      - name: B4.1 corpus status, readiness and credential redaction
        run: |
          python - <<'PY'
          import tempfile, pathlib
          from market_intelligence.cli import _corpus_status, _provider_report
          from market_intelligence.collection.policy import redact_mapping
          from market_intelligence.storage import IntelligenceStore

          with tempfile.TemporaryDirectory() as tmp:
              store = IntelligenceStore(pathlib.Path(tmp) / "empty.duckdb")
              status = _corpus_status(store, "rules-v1", ["SEC", "Donald Trump"])
              assert status.readiness.value == "NOT_READY", status.readiness
              assert all(not f.ready for f in status.families)
              assert "Donald Trump" in status.missing_entities
              store.close()

          rows = _provider_report()
          assert {r["provider_id"] for r in rows} >= {"syndication", "statements", "whales"}
          assert not any(r["operable"] and r["credentials_env"] and not r["credential_present"]
                         for r in rows), "a provider without its credential must not be operable"
          assert redact_mapping({"api_key": "sk-live-1"})["api_key"] == "<redacted>"
          print("B4.1 corpus status and redaction OK")
          PY
      # O19: operations smoke, entirely offline. Fixture providers, a temp
      # state root, no credentials and no network.
      - name: B4.1-Ops lock, storage, crash recovery and integrity
        run: |
          python - <<'PY'
          import pathlib, tempfile
          from datetime import datetime, timedelta, timezone
          from market_intelligence.collection.fixtures import (
              OutageProvider, StaticFixtureProvider, fixture_document,
          )
          from market_intelligence.collection.service import ForwardCollector
          from market_intelligence.configuration import (
              EntityType, ProviderCategory, ProviderConfig, QueryPlanner, WatchEntity,
          )
          from market_intelligence.extractors import RuleBasedExtractor
          from market_intelligence.models import EventType
          from market_intelligence.ops.integrity import verify
          from market_intelligence.ops.paths import StoragePaths, require_usable
          from market_intelligence.ops.runlock import LockHeld, RunLock
          from market_intelligence.retrieval import MultiProviderRetriever
          from market_intelligence.storage import IntelligenceStore

          now = datetime(2026, 9, 2, 9, 0, tzinfo=timezone.utc)
          watch = [WatchEntity(canonical_name="SEC", aliases=("Securities and Exchange Commission",),
                               entity_type=EntityType.REGULATOR, topics=("bitcoin regulation",),
                               expected_event_types=(EventType.REGULATION,))]
          with tempfile.TemporaryDirectory() as tmp:
              paths = StoragePaths.from_environment(pathlib.Path(tmp) / "state").ensure()
              require_usable(paths, require_free_bytes=1)

              # One collector at a time, and a dead one never wedges collection.
              first = RunLock(paths.lock, now=lambda: now).acquire()
              try:
                  RunLock(paths.lock, now=lambda: now).acquire()
                  raise AssertionError("a second collector must be refused")
              except LockHeld:
                  pass
              first.release()
              assert not paths.lock.exists()

              queries = QueryPlanner().plan(watch, now)
              docs = [fixture_document(url=f"https://p{i}.example.gov/r{i}",
                                       title=f"SEC regulation notice {i} concerning bitcoin",
                                       retrieved_at=now - timedelta(hours=1),
                                       publisher=f"p{i}.example.gov", provider="syndication",
                                       query=queries[0].query, primary_source=True,
                                       official_source=True, body=f"b{i}") for i in range(3)]
              providers = {"syndication": StaticFixtureProvider(docs, name="syndication",
                                                                now=lambda: now, restamp=False),
                           "outage": OutageProvider()}
              configs = {n: ProviderConfig(id=n, type="fixture",
                                           source_category=ProviderCategory.GENERAL_WEB, timeout=5.0)
                         for n in providers}
              extractor = RuleBasedExtractor({"SEC": ("Securities and Exchange Commission",)})

              store = IntelligenceStore(paths.database)
              collector = ForwardCollector(store, now=lambda: now)
              first_run = collector.collect(queries, MultiProviderRetriever(providers, configs),
                                            extractor, {}, manifest_path=paths.manifests / "one.json")
              assert first_run.manifest.documents_new == 3, first_run.manifest.documents_new
              assert first_run.manifest.provider_success["outage"] is False

              before = {d.document_id: d.available_at for d in store.documents_as_of(now)}
              later = now + timedelta(days=3)
              collector._now = lambda: later
              again = collector.collect(QueryPlanner().plan(watch, later),
                                        MultiProviderRetriever(providers, configs), extractor, {})
              after = {d.document_id: d.available_at
                       for d in store.documents_as_of(later + timedelta(hours=1))}
              assert again.manifest.documents_new == 0, "rediscovery must not add documents"
              assert after == before, "rediscovery must not move availability"

              report = verify(store, as_of=later)
              assert report.ok, report.human_readable()
              store.close()
          print("B4.1-Ops runtime OK")
          PY
      - name: B4.1-Ops watchdog, summary and readiness gating
        run: |
          python - <<'PY'
          from datetime import date, datetime, timedelta, timezone
          from market_intelligence.collection.readiness import assess_family
          from market_intelligence.ops.integrity import IntegrityStatus
          from market_intelligence.ops.summary import contains_forbidden_statistics
          from market_intelligence.ops.watchdog import (
              AlertCode, Severity, WatchdogInput, assess, consecutive_zero_days,
          )

          now = datetime(2026, 9, 2, 9, 0, tzinfo=timezone.utc)

          def state(**over):
              base = dict(now=now, last_run_at=now, last_successful_run_at=now,
                          providers_enabled=2, providers_healthy=2,
                          provider_last_success={"syndication": now},
                          documents_last_24h=0, events_last_24h=0, quarantined_last_24h=0,
                          storage_ok=True, storage_detail="",
                          integrity_status=IntegrityStatus.OK, integrity_detail="",
                          last_backup_at=now - timedelta(days=1),
                          consecutive_zero_days_with_success=1)
              base.update(over)
              return WatchdogInput(**base)

          # A quiet day is healthy; an outage is not.
          quiet = assess(state())
          assert quiet.healthy and quiet.exit_code == 0
          assert quiet.alerts[0].detail["quiet_day"] is True
          outage = assess(state(providers_healthy=0))
          assert outage.exit_code == 2
          assert any(a.code is AlertCode.ALL_PROVIDERS_FAILED for a in outage.alerts)
          assert assess(state(integrity_status=IntegrityStatus.CORRUPT)).worst is Severity.CRITICAL
          assert any(a.code is AlertCode.IMPLAUSIBLE_ZERO_COLLECTION
                     for a in assess(state(consecutive_zero_days_with_success=30)).alerts)

          today = date(2026, 9, 2)
          assert consecutive_zero_days({today: 0}, [today], today) == 1

          # O20: no return statistic may ever reach an operations surface.
          assert contains_forbidden_statistics({"b4_readiness": {"status": "NOT_READY"}}) == ()
          assert "forward_return" in contains_forbidden_statistics({"x": {"forward_return_1d": 0.1}})

          # An empty family is NOT_READY with reasons, and the bar is unchanged.
          empty = assess_family("regulation", [])
          assert not empty.ready and any("need 30" in r for r in empty.unmet)
          print("B4.1-Ops watchdog and gating OK")
          PY
      - name: B4 bootstrap determinism
        run: |
          python -c "from market_intelligence.b4.stats import BootstrapConfig, block_bootstrap; c=BootstrapConfig(replicates=200,block_length=5,seed=42); v=[(i*7%13)/100.0 for i in range(200)]; a=block_bootstrap(v,c); b=block_bootstrap(v,c); assert (a.lower,a.upper,a.p_value)==(b.lower,b.upper,b.p_value); print('B4 bootstrap deterministic')"
